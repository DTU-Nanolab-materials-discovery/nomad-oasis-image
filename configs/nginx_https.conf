# Nginx configuration for handling HTTPS requests
# - Redirects all HTTP traffic to HTTPS
# - Serves a certificate plus intermediate chain

include conf.d/nginx_maps_conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Pool of keep-alive connections to the app backend
upstream nomad-app-backend {
    server app:8000;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Redirect all to HTTPS
server {
    listen 80;
    server_name nomad.nanolab.dtu.dk;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name nomad.nanolab.dtu.dk;

    # TLS certificate configuration
    ssl_certificate     /etc/nginx/tls/mounted-nomad-oasis.pem;
    ssl_certificate_key /etc/nginx/tls/mounted-nomad-oasis.key;

    proxy_set_header Host $host;

    # Reuse upstream keep-alive connections
    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    include conf.d/nginx_base_conf;
}
